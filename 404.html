<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Rebar Ahmad</title>
<meta name="description" content="Rebar Ahmad — software developer.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👋</text></svg>">
<style>
  /* Light is the base; dark is the same palette with the roles swapped. Both
     are declared, so the page never borrows a colour from the browser. */
  :root {
    --bg: #f6f5f1;
    --fg: #1c1b22;
    --muted: #6b6875;
    --rule: #e3e0d8;
    --accent: #b8860b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14131a;
      --fg: #f2f0ea;
      --muted: #9a96a6;
      --rule: #2a2833;
      --accent: #d9a032;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 400 1rem/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main { width: 100%; max-width: 34rem; }

  h1 {
    margin: 0 0 .35rem;
    font-size: clamp(1.9rem, 6vw, 2.6rem);
    font-weight: 650;
    letter-spacing: -0.02em;
  }

  .role { margin: 0 0 2rem; color: var(--muted); }

  ul { margin: 0; padding: 0; list-style: none; }

  li + li { border-top: 1px solid var(--rule); }

  a.row {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    padding: .85rem 0;
    color: inherit;
    text-decoration: none;
  }
  a.row:hover .name,
  a.row:focus-visible .name { color: var(--accent); }
  a.row:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }

  .name { font-weight: 550; transition: color .15s ease; }
  .what { margin-left: auto; color: var(--muted); font-size: .9rem; text-align: right; }

  footer {
    margin-top: 2.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    color: var(--muted);
    font-size: .85rem;
  }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Rebar Ahmad</h1>
  <p class="role">That page does not exist.</p>

  <ul>
    <li>
      <a class="row" href="https://github.com/Ahmadre">
        <span class="name">GitHub</span>
        <span class="what">@Ahmadre</span>
      </a>
    </li>
    <li>
      <a class="row" href="https://hinata.ahmadre.com">
        <span class="name">Hinata</span>
        <span class="what">open-source, self-hosted project tracking</span>
      </a>
    </li>
  </ul>

  <footer>
    <a href="/">Back to the start</a>.
  </footer>
</main>
</body>
</html>
